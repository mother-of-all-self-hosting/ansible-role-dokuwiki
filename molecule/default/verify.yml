---
- name: Verify DokuWiki systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for DokuWiki service to become active (up to 180s)
      ansible.builtin.systemd:
        name: dokuwiki.service
      register: dokuwiki_service
      until: dokuwiki_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert DokuWiki service is active
      ansible.builtin.assert:
        that: dokuwiki_service.status.ActiveState == 'active'
        fail_msg: "dokuwiki.service not active ({{ dokuwiki_service.status.ActiveState }})"
        success_msg: "dokuwiki.service is active"

    - name: Wait for DokuWiki HTTP endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:8080/"
        method: GET
        status_code: [200, 302]
        follow_redirects: none
      register: dokuwiki_endpoint
      until: dokuwiki_endpoint.status in [200, 302]
      retries: 120
      delay: 5

    - name: Assert DokuWiki HTTP endpoint responds
      ansible.builtin.assert:
        that: dokuwiki_endpoint.status in [200, 302]
        fail_msg: "DokuWiki did not respond as expected ({{ dokuwiki_endpoint.status | default('no response') }})"
        success_msg: "DokuWiki responded with {{ dokuwiki_endpoint.status }}"

    - name: Show DokuWiki systemd service status summary
      ansible.builtin.debug:
        msg:
          - "DokuWiki systemd: {{ dokuwiki_service.status.ActiveState }}"
          - "DokuWiki HTTP: {{ dokuwiki_endpoint.status }}"
